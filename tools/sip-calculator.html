<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SIP & Compound Interest Calculator - SmartToolHub</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1891031290159418" crossorigin="anonymous"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans"><div class="max-w-4xl mx-auto"><a href="../index.html" class="text-cyan-400 text-sm">← Back to Tools</a><h1 class="text-2xl font-bold my-4">📈 SIP & Wealth Calculator</h1><div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-800/80 border border-slate-700 rounded-xl p-6"><div class="space-y-4 md:col-span-2"><div><label class="block text-xs font-semibold text-slate-300 mb-1">Monthly Investment (₹)</label><input type="number" id="p" value="5000" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-cyan-400 font-mono"></div><div><label class="block text-xs font-semibold text-slate-300 mb-1">Expected Return Rate (% p.a.)</label><input type="number" id="r" value="12" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-cyan-400 font-mono"></div><div><label class="block text-xs font-semibold text-slate-300 mb-1">Time Period (Years)</label><input type="number" id="y" value="10" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-cyan-400 font-mono"></div></div><div class="bg-slate-950 border border-slate-700 rounded-xl p-4 flex flex-col justify-center space-y-4 text-center"><div><div class="text-xs text-slate-400">Total Invested</div><div id="inv" class="text-lg font-bold text-slate-200">₹ 6,00,000</div></div><div><div class="text-xs text-slate-400">Estimated Returns</div><div id="ret" class="text-lg font-bold text-emerald-400">₹ 5,61,695</div></div><div class="border-t border-slate-800 pt-3"><div class="text-xs text-cyan-400 font-semibold">Future Value</div><div id="tot" class="text-2xl font-black text-cyan-300">₹ 11,61,695</div></div></div></div></div><script>function c(){const p=parseFloat(document.getElementById("p").value)||0;const r=parseFloat(document.getElementById("r").value)||0;const y=parseFloat(document.getElementById("y").value)||0;const i=(r/12)/100;const n=y*12;const inv=p*n;const tot=i>0?p*((Math.pow(1+i,n)-1)/i)*(1+i):inv;document.getElementById("inv").innerText="₹ "+Math.round(inv).toLocaleString("en-IN");document.getElementById("ret").innerText="₹ "+Math.round(tot-inv).toLocaleString("en-IN");document.getElementById("tot").innerText="₹ "+Math.round(tot).toLocaleString("en-IN");}["p","r","y"].forEach(id=>document.getElementById(id).addEventListener("input",c));c();</script></body></html>
