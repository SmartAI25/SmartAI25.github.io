<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>SHA-256 Generator - SmartToolHub</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans"><div class="max-w-4xl mx-auto"><a href="../index.html" class="text-cyan-400 text-sm">← Back to Tools</a><h1 class="text-2xl font-bold my-4">🔒 SHA-256 Hash Generator</h1><textarea id="t" class="w-full h-32 bg-slate-950 border border-slate-700 rounded p-3 text-cyan-300 font-mono text-sm" placeholder="Enter text to hash..."></textarea><div class="mt-4"><label class="text-xs text-slate-400">SHA-256 Hash Output</label><input type="text" id="h" readonly class="w-full bg-slate-950 border border-slate-700 rounded p-3 text-emerald-400 font-mono text-sm mt-1"></div></div><script>async function d(m){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(m));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}document.getElementById("t").addEventListener("input",async(e)=>{document.getElementById("h").value=e.target.value?await d(e.target.value):"";});</script></body></html>
