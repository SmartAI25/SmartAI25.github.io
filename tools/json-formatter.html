<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>JSON Formatter - SmartToolHub</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans"><div class="max-w-4xl mx-auto"><a href="../index.html" class="text-cyan-400 text-sm">← Back to Tools</a><h1 class="text-2xl font-bold my-4">⚙️ JSON Formatter</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><textarea id="in" class="h-64 bg-slate-950 border border-slate-700 rounded p-3 text-cyan-300 font-mono text-sm" placeholder="Paste JSON here..."></textarea><textarea id="out" readonly class="h-64 bg-slate-950 border border-slate-700 rounded p-3 text-emerald-400 font-mono text-sm"></textarea></div><div class="mt-4 flex gap-3"><button onclick="try{out.value=JSON.stringify(JSON.parse(in.value),null,2)}catch(e){out.value=e.message}" class="px-4 py-2 bg-cyan-600 rounded text-sm font-semibold">Format</button><button onclick="try{out.value=JSON.stringify(JSON.parse(in.value))}catch(e){out.value=e.message}" class="px-4 py-2 bg-slate-800 rounded text-sm">Minify</button></div></div></body></html>
